# Сборка всех расширений репозитория (HenChan, MultiManga) и публикация
# персонального репозитория.
#
# Схема: push в main → matrix-сборка с подписью → GitHub Releases с APK и jar →
# ветка `repo` репозитория hametovbr/extensions с общим index.json/index.pb.
#
# Секреты репозитория:
#   SIGNING_KEY       — keystore (signingkey.jks) в base64, одна строка
#   ALIAS             — алиас ключа в keystore
#   KEY_STORE_PASSWORD, KEY_PASSWORD — пароли keystore и ключа
#   PUBLISH_TOKEN     — PAT с правом push в hametovbr/extensions и созданием релизов
name: Build and publish

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-and-publish
  cancel-in-progress: true

env:
  EXTENSIONS_REPO: "hametovbr/extensions"

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - module: ":src:ru:henchan"
            dir: "src/ru/henchan"
            name: "HenChan"
          - module: ":src:ru:multimanga"
            dir: "src/ru/multimanga"
            name: "MultiManga"
    env:
      MODULE: ${{ matrix.module }}
      MODULE_DIR: ${{ matrix.dir }}
    steps:
      - name: Checkout main branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: 25
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Prepare signing key
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          ALIAS: ${{ secrets.ALIAS }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${SIGNING_KEY}" ]; then
            echo "::error::секрет SIGNING_KEY не задан — сборка была бы подписана debug-ключом"
            exit 1
          fi
          if [ -z "${ALIAS}" ] || [ -z "${KEY_STORE_PASSWORD}" ]; then
            echo "::error::секреты ALIAS / KEY_STORE_PASSWORD не заданы"
            exit 1
          fi
          umask 077
          echo "${SIGNING_KEY}" | base64 -d > signingkey.jks
          test -s signingkey.jks
          # Падает сразу и понятно, если keystore битый или пароль/алиас не совпадают,
          # а не через три минуты на packageRelease у случайного модуля.
          keytool -list -keystore signingkey.jks -storepass "${KEY_STORE_PASSWORD}" -alias "${ALIAS}" > /dev/null

      - name: Build and lint
        env:
          ALIAS: ${{ secrets.ALIAS }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew "${MODULE}:assembleRelease" "${MODULE}:lintRelease"

      - name: Show build metadata
        run: |
          set -euo pipefail
          info="${MODULE_DIR}/build/keiyoushi-source-info.json"
          test -f "${info}"
          cat "${info}"

      - name: Upload extension artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: extension-${{ matrix.name }}
          path: |
            **/build/outputs/apk/release/*.apk
            **/build/outputs/jar/release/*.jar
            **/build/keiyoushi-source-info.json
          retention-days: 1

      - name: Clean up CI files
        if: always()
        run: rm -f signingkey.jks

  publish:
    name: Publish repo
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check publish token
        env:
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
        run: |
          if [ -z "${PUBLISH_TOKEN}" ]; then
            echo "::error::секрет PUBLISH_TOKEN не задан — нечем пушить в ${EXTENSIONS_REPO}"
            exit 1
          fi

      - name: Checkout main branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          path: main
          persist-credentials: false

      - name: Checkout repo branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.EXTENSIONS_REPO }}
          token: ${{ secrets.PUBLISH_TOKEN }}
          ref: repo
          path: repo
          persist-credentials: true

      - name: Compute signing fingerprint
        id: fingerprint
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          ALIAS: ${{ secrets.ALIAS }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
        run: |
          set -euo pipefail
          echo "${SIGNING_KEY}" | base64 -d > "${RUNNER_TEMP}/signingkey.jks"
          value=$(keytool -list -v -keystore "${RUNNER_TEMP}/signingkey.jks" -storepass "${KEY_STORE_PASSWORD}" -alias "${ALIAS}" \
            | sed -n 's/.*SHA256: //p' | tr -d ':' | tr '[:upper:]' '[:lower:]')
          test -n "${value}"
          echo "value=${value}" >> "${GITHUB_OUTPUT}"

      - name: Download extension artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: extension-*
          merge-multiple: true
          path: ~/apk-artifacts

      - name: Publish and deploy repo
        working-directory: repo
        env:
          GH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
          FINGERPRINT: ${{ steps.fingerprint.outputs.value }}
        run: |
          set -euo pipefail
          python3 -m venv "${RUNNER_TEMP}/publish-venv"
          "${RUNNER_TEMP}/publish-venv/bin/pip" install --quiet --upgrade pip protobuf
          "${RUNNER_TEMP}/publish-venv/bin/python" -u ../main/.github/scripts/publish-repo.py "${FINGERPRINT}" "${GITHUB_SHA}"

          versions=$(find ~/apk-artifacts -name keiyoushi-source-info.json -print0 \
            | xargs -0 -I{} jq -r '"\(.name) \(.versionName)"' {} | paste -sd, -)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git status --short
          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            git commit -m "Publish ${versions}"
            git push
          else
            echo "Индекс не изменился, коммит не нужен"
          fi
